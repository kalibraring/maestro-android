[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "maestro-android"
version = "0.1.0"
description = "Android-focused companion CLI for Maestro workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6.0.2,<7",
]
authors = [
  { name = "mkamar" },
]
keywords = ["android", "maestro", "testing", "cli"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]

[project.scripts]
maestro-android = "maestro_android.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/maestro_android"]
